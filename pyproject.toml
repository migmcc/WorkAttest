[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workattest"
version = "0.1.0"
description = "Verifiable Work Accountability — cryptographically link request, authorization, execution, evidence, verification and human approval to a signed, offline-verifiable receipt for AI-assisted work."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Miguel Santos", email = "migmcc@gmail.com" }]
keywords = ["accountability", "provenance", "attestation", "ai", "receipts", "ed25519"]
dependencies = [
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
workattest = "workattest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
