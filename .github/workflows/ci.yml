name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run the full test suite
        run: python -m pytest
      - name: Run the adversarial tamper suite (T-1...T-12)
        run: python -m pytest tests/adversarial -v

  verify-vectors:
    # T-11: the receipts in tests/vectors/ were signed on the maintainer's Windows
    # machine. Verifying them here proves the central claim of the product — a receipt
    # is checkable on a machine that never saw the issuer, using only the receipt file
    # and the public key inside it.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the package only (no dev dependencies)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Verify each receipt vector offline
        shell: bash
        run: |
          for vector in tests/vectors/receipt-*.json; do
            echo "--- $vector"
            workattest receipt verify "$vector"
          done
      - name: Verify the receipt chain offline
        shell: bash
        run: |
          workattest receipt verify-chain \
            tests/vectors/receipt-chain-001.json \
            tests/vectors/receipt-chain-002.json
